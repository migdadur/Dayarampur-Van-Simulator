for(const x of[-1,1])SP(g,.25,0xffe98a,x,1.1,3.02);B(g,2.6,.6,3,0xb98a55,0,3.6,0);
for(let i=0;i<3;i++){const f=fig(COL[i+2],'sit');f.position.set(-.9+i*.9,3.95,1.6);g.add(f)}}

return g}
